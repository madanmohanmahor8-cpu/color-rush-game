here<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Loop Match</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #ui-box { text-align: center; margin-bottom: 10px; }
        .score-text { font-size: 32px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        #msg { font-size: 16px; color: #fff; opacity: 0.9; margin-top: 5px; }
        canvas { 
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 50%; 
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5); 
            cursor: pointer;
        }
        #creator-tag {
            margin-top: 15px;
            font-size: 14px;
            color: #fff;
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui-box">
        <div class="score-text">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
        <div id="msg">Tap anywhere to match the water loop!</div>
    </div>
    
    <canvas id="gameCanvas" width="340" height="340"></canvas>

    <div id="creator-tag">Created by Madan Mohan (2026)</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const msgEl = document.getElementById('msg');

        const colors = ['#00f2fe', '#4facfe', '#000000', '#ff0844'];
        let ringAngle = 0;
        let currentColorIndex = 0;
        let score = 0;
        let highScore = localStorage.getItem('mm_highscore') || 0;
        bestEl.innerText = highScore;

        let ballRadius = 0;
        let speed = 2.5;
        let isGameOver = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function drawRing() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 110;
            const sliceAngle = (Math.PI * 2) / 4;

            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, ringAngle + i * sliceAngle, ringAngle + (i + 1) * sliceAngle);
                ctx.lineWidth = 24;
                ctx.strokeStyle = colors[i];
                ctx.shadowBlur = 15;
                ctx.shadowColor = colors[i];
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function drawWaterBall() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = colors[currentColorIndex];
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.max(0, ballRadius - 10), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fill();
            ctx.restore();
        }

        function getBottomColorIndex() {
            let normalizedAngle = (ringAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            let activeIndex = Math.floor(((2 * Math.PI - normalizedAngle) % (Math.PI * 2)) / (Math.PI / 2));
            return (activeIndex + 1) % 4;
        }

        function resetBall() {
            ballRadius = 0;
            currentColorIndex = Math.floor(Math.random() * 4);
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ballRadius += speed;

            if (ballRadius >= 98) {
                if (currentColorIndex === getBottomColorIndex()) {
                    score += 1;
                    scoreEl.innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('mm_highscore', highScore);
                        bestEl.innerText = highScore;
                    }
                    speed += 0.15; 
                    playSound(600, 0.1);
                    resetBall();
                } else {
                    isGameOver = true;
                    playSound(150, 0.3);
                    msgEl.innerHTML = "<b style='color:#ff4757;'>GAME OVER! Tap to try again</b>";
                }
            }

            drawRing();
            drawWaterBall();
            requestAnimationFrame(update);
        }

        function handleTap() {
            if (isGameOver) {
                score = 0; speed = 2.5; isGameOver = false;
                scoreEl.innerText = score;
                msgEl.innerText = "Tap anywhere to match the water loop!";
                resetBall();
                update();
            } else {
                ringAngle += Math.PI / 2;
                playSound(400, 0.05);
            }
        }

        window.addEventListener('click', handleTap);
        resetBall();
        update();
    </script>
</body>
</html>
