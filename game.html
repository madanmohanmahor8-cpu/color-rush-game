<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>Color Rush — Neon Challenge</title>
<style>
:root{--bg:#090d18;--card:#11182a;--line:#26314a;--text:#f5f7ff;--muted:#9ca9c4;--accent:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#253263 0,#090d18 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{width:min(820px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:27px;letter-spacing:-.5px}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#11182acc;font-weight:800}
.card{background:#11182ae8;border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(12px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#182137;border:1px solid #273452;border-radius:16px;padding:9px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted);font-weight:700}
#status{text-align:center;margin:15px 0 11px;color:#dbe2f3;font-weight:700}.target{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:620px;margin:auto}.btn{border:0;border-radius:22px;aspect-ratio:1;cursor:pointer;box-shadow:inset 0 -7px 0 #0002,0 8px 18px #0004;transition:transform .08s,filter .15s}.btn:active{transform:scale(.92)}.btn:hover{filter:brightness(1.08)}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-top:14px}.action{border:0;border-radius:15px;padding:13px;font-weight:900;cursor:pointer;background:#fff;color:#0a0d15}.secondary{background:#202a40;color:#fff}
.progress{height:7px;background:#202a40;border-radius:99px;margin:14px 0 0;overflow:hidden}.bar{height:100%;width:100%;background:#7c5cff;transition:width 1s linear}
.ad{margin:14px 0;padding:12px;border:1px dashed #35415b;border-radius:14px;text-align:center;color:#74819b;font-size:11px}
.overlay{margin-top:14px;text-align:center;padding:18px;background:#182137;border:1px solid #2a3755;border-radius:18px}.overlay h2{margin:2px 0 8px;font-size:31px}.hidden{display:none}.hint{font-size:12px;color:#8490a8;line-height:1.5;text-align:center}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#fff;color:#0a0d15;padding:10px 16px;border-radius:999px;font-weight:900;transition:.2s;z-index:5}.show{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
@media(max-width:480px){.wrap{padding:10px}.card{padding:12px;border-radius:22px}.grid{gap:8px}.btn{border-radius:17px}.controls{grid-template-columns:1fr 1fr}.controls .main{grid-column:1/-1}}
</style>
</head>
<body>
<div id="toast"></div>
<main class="wrap">
<div class="top"><h1>🎨 Color Rush</h1><div class="badge">🏆 Best <span id="high">0</span></div></div>
<section class="card">
<div class="stats">
<div class="stat"><b id="score">0</b><span>SCORE</span></div>
<div class="stat"><b id="time">45</b><span>TIME</span></div>
<div class="stat"><b id="combo">0</b><span>COMBO</span></div>
<div class="stat"><b id="level">1</b><span>LEVEL</span></div>
</div>
<div id="status" class="target">Press START to begin</div>
<div class="grid" id="grid"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls">
<button class="action main" id="start">▶ START GAME</button>
<button class="action secondary" id="sound">🔊 Sound</button>
<button class="action secondary" id="pause">⏸ Pause</button>
</div>
<div class="ad">ADVERTISEMENT SPACE — suitable for a future ad network</div>
<div class="overlay hidden" id="result">
<h2 id="resultTitle">Time's Up!</h2>
<div>Final Score: <strong id="final">0</strong></div>
<div id="record"></div><br>
<button class="action" id="again">🔥 PLAY AGAIN</button>
</div>
<p class="hint">Fast reactions • Combo bonuses • Levels • Local high score • Sound effects • Mobile friendly</p>
</section>
</main>
<script>
const COLORS=[
["RED","#ff4057"],["BLUE","#3d8bff"],["GREEN","#27c875"],
["YELLOW","#f5c542"],["PURPLE","#a66cff"],["ORANGE","#ff8738"],
["PINK","#ff5fc7"],["CYAN","#2bd9e8"],["LIME","#a6e83b"]
];
let score=0,combo=0,time=45,level=1,running=false,paused=false,timer=null,target=0,sound=true;
let high=+localStorage.getItem("cr_high")||0;
const $=x=>document.getElementById(x);$("high").textContent=high;

function tone(freq,d=.06,type="sine"){
 if(!sound)return;
 try{let A=new AudioContext(),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}
}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function build(){
 const count=level>=4?12:9; $("grid").style.gridTemplateColumns=count===12?"repeat(4,1fr)":"repeat(3,1fr)";
 target=Math.floor(Math.random()*Math.min(COLORS.length,5+Math.floor(level/2)));
 $("status").innerHTML="Find the <b>"+COLORS[target][0]+"</b> tile";
 let correct=target, arr=[correct];
 while(arr.length<count){let x=Math.floor(Math.random()*COLORS.length);if(x!==correct||Math.random()<.25)arr.push(x)}
 shuffle(arr);let g=$("grid");g.innerHTML="";
 arr.forEach(idx=>{let b=document.createElement("button");b.className="btn";b.style.background=COLORS[idx][1];b.setAttribute("aria-label",COLORS[idx][0]);b.onclick=()=>choose(idx===correct);g.appendChild(b)});
}
function choose(ok){
 if(!running||paused)return;
 if(ok){
   combo++;let gain=10+Math.min(combo,15)*2+level*2;score+=gain;
   tone(560+combo*15,.055,"triangle");
   if(combo%5===0){score+=35*level;toast("🔥 "+combo+" COMBO! +BONUS");tone(880,.1)}
   if(score>=level*180){level++;toast("⚡ LEVEL "+level);tone(990,.12,"square")}
   build();
 }else{
   combo=0;score=Math.max(0,score-8);tone(160,.1,"sawtooth");toast("❌ -8");
 }
 update();
}
function update(){
 $("score").textContent=score;$("time").textContent=time;$("combo").textContent=combo;$("level").textContent=level;
 $("bar").style.width=(time/45*100)+"%";
}
function start(){
 clearInterval(timer);score=0;combo=0;time=45;level=1;running=true;paused=false;
 $("pause").textContent="⏸ Pause";$("start").textContent="↻ Restart";$("result").classList.add("hidden");
 update();build();
 timer=setInterval(()=>{if(!paused){time--;update();if(time<=0)finish()}},1000);
}
function finish(){
 clearInterval(timer);running=false;
 $("final").textContent=score;
 let newRec=score>high;if(newRec){high=score;localStorage.setItem("cr_high",high);$("high").textContent=high}
 $("record").textContent=newRec?"🏆 NEW HIGH SCORE!":"Best: "+high;
 $("resultTitle").textContent=score>=500?"🔥 Amazing Run!":"🎉 Time's Up!";
 $("result").classList.remove("hidden");tone(700,.15);setTimeout(()=>tone(900,.15),120);
}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),850)}
$("start").onclick=start;$("again").onclick=start;
$("pause").onclick=()=>{if(!running)return;paused=!paused;$("pause").textContent=paused?"▶ Resume":"⏸ Pause";$("status").textContent=paused?"Game Paused — tap Resume":"Find the target color";}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 Sound":"🔇 Sound Off";if(sound)tone(700,.06)}
update();
</script>
</body>
</html>
